# UniPark · Sitio SOLO para la copia de demostración, al que llega el túnel del celular (scripts/demo-celular.bat).
#
# - Escucha únicamente en 127.0.0.1:8090: no se ve desde la red; solo el túnel (cloudflared, en este mismo PC) llega aquí.
# - Expone ÚNICAMENTE /UniParkDemo y los archivos públicos que la demo toma de /UniPark (estilos, scripts, íconos,
#   service worker y manifiesto). El sistema real (/UniPark), phpMyAdmin, el panel de XAMPP y el resto de htdocs
#   responden 403 por este puerto. El sitio de siempre (puerto 80) no cambia.
# - Se carga desde C:\xampp\apache\conf\httpd.conf con:
#     Include "C:/xampp/htdocs/UniPark/scripts/apache/unipark-demo-celular.conf"

Listen 127.0.0.1:8090

<VirtualHost 127.0.0.1:8090>
    ServerName unipark-demo-celular
    DocumentRoot "C:/xampp/htdocs"

    RewriteEngine On
    # La raíz del túnel lleva directo a la demo.
    RewriteRule ^/?$ /UniParkDemo/ [R=302,L]

    # Todo lo que no sea la demo o sus recursos públicos: denegado.
    <LocationMatch "^/(?!UniParkDemo(/|$)|UniPark/assets/|UniPark/sw\.js$|UniPark/manifest\.webmanifest$)">
        Require all denied
    </LocationMatch>
    # Los archivos ocultos y de configuración siguen protegidos por los .htaccess de UniPark y de UniParkDemo.
</VirtualHost>
